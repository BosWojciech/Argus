[project]
name = "argus"
version = "0.1.0"
description = "Generator danych testowych - desktop generator of valid Polish test data"
readme = "README.md"
license = "MIT"
authors = [{ name = "Wojciech Boś" }]
requires-python = ">=3.13"
dependencies = ["customtkinter>=5.2.2"]

[project.scripts]
argus = "argus.app:main"

[dependency-groups]
dev = ["pytest>=8", "truststore>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
